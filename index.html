<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKA Music Studios · Catálogo Oficial</title>
<!-- Librería de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #101114;
  --panel: #1b1d23;
  --panel2: #252831;
  --text: #f3f3f5;
  --muted: #a5a7b0;
  --accent: #d6a85f;
  --border: #343740;
  --error: #e74c3c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  padding: 20px;
}
.web-container {
  max-width: 1100px;
  margin: auto;
}
header {
  text-align: center;
  margin-bottom: 25px;
}
header h1 { color: var(--accent); margin: 0 0 5px 0; font-size: 26px; }
header p { color: var(--muted); margin: 0; font-size: 13px; }

/* Barra de Filtros */
.filters-bar {
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 25px;
}
.genre-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tab-btn {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  transition: all 0.2s;
}
.tab-btn:hover { border-color: var(--accent); }
.tab-btn.active {
  background: var(--accent);
  color: #101114;
  border-color: var(--accent);
}

.lang-filter {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--muted);
}
.lang-filter select {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
}

/* Grid de Colecciones (Álbumes / Playlists) */
.collections-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); }
.card-img-container {
  position: relative;
  width: 100%;
  padding-top: 100%; /* Cuadrado perfecto */
  background: var(--panel2);
}
.card-img-container img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.badges-overlay {
  position: absolute;
  top: 10px; left: 10px;
  display: flex;
  gap: 5px;
}
.badge {
  background: rgba(16, 17, 20, 0.85);
  color: var(--accent);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  border: 1px solid var(--border);
}
.card-body {
  padding: 15px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.card-title {
  font-size: 15px;
  font-weight: bold;
  margin: 0 0 5px 0;
  color: var(--text);
}
.card-author {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
}
.tracks-list {
  background: var(--panel2);
  border-radius: 6px;
  padding: 8px;
  max-height: 110px;
  overflow-y: auto;
  font-size: 11px;
  margin-top: auto;
}
.track-item {
  padding: 4px 0;
  border-bottom: 1px solid rgba(52, 55, 64, 0.5);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track-item:last-child { border-bottom: none; }
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px;
  color: var(--muted);
  font-style: italic;
}
</style>
</head>
<body>

<div class="web-container">
  <header>
    <h1>IKA Music Studios</h1>
    <p>Catálogo oficial de producciones independientes</p>
  </header>

  <!-- Barra de Filtros -->
  <div class="filters-bar">
    <div class="genre-tabs" id="genre-tabs">
      <button class="tab-btn active" data-genre="rock">Rock</button>
      <button class="tab-btn" data-genre="pop">Pop</button>
      <button class="tab-btn" data-genre="flamenco">Flamenco / Rumba</button>
      <button class="tab-btn" data-genre="folk">Folk</button>
      <button class="tab-btn" data-genre="electronic">Electronic / Dance</button>
      <button class="tab-btn" data-genre="balada">Balada / Acústico</button>
    </div>

    <div class="lang-filter">
      <label for="language-select">Idioma:</label>
      <select id="language-select" onchange="fetchCatalog()">
        <option value="all">🌐 Todos los idiomas</option>
        <option value="es">Español 🇪🇸</option>
        <option value="en">Inglés 🇬🇧</option>
        <option value="ru">Ruso 🇷🇺</option>
        <option value="fr">Francés 🇫🇷</option>
        <option value="it">Italiano 🇮🇹</option>
        <option value="pt">Portugués 🇵🇹</option>
        <option value="de">Alemán 🇩🇪</option>
        <option value="la">Latín / Varios 🌍</option>
        <option value="other">Otro 🌐</option>
        <option value="instrumental">Instrumental 🎼</option>
      </select>
    </div>
  </div>

  <!-- Contenedor del Catálogo -->
  <div class="collections-grid" id="catalog-grid">
    <div class="no-results">Cargando catálogo...</div>
  </div>
</div>

<script>
// Conexión a Supabase (Credenciales públicas)
const supabaseUrl = 'https://mouvifqcmdlypegtyjfw.supabase.co';
const supabaseKey = 'sb_publishable_5bqnQQBhY5QRnhGW9p7fuA_C4Y2crZP';
const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

// Estado inicial del género seleccionado
let currentGenre = 'rock';

document.addEventListener("DOMContentLoaded", () => {
  // Manejo de pestañas de género
  const buttons = document.querySelectorAll(".tab-btn");
  buttons.forEach(btn => {
    btn.addEventListener("click", (e) => {
      buttons.forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      currentGenre = e.target.getAttribute("data-genre");
      fetchCatalog();
    });
  });

  // Carga inicial al abrir la web
  fetchCatalog();
});

async function fetchCatalog() {
  const grid = document.getElementById("catalog-grid");
  const selectedLang = document.getElementById("language-select").value;

  grid.innerHTML = `<div class="no-results">Buscando colecciones...</div>`;

  try {
    let query = _supabase
      .from('collections')
      .select('*')
      .eq('style', currentGenre);

    if (selectedLang !== 'all') {
      query = query.eq('language', selectedLang);
    }

    const { data, error } = await query.order('id', { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      grid.innerHTML = `<div class="no-results">No hay colecciones publicadas en este estilo e idioma actualmente.</div>`;
      return;
    }

    // Renderizar tarjetas dinámicamente
    grid.innerHTML = data.map(item => {
      const tracksHtml = item.tracks && item.tracks.length > 0 
        ? item.tracks.map(t => `<div class="track-item">🎵 ${t.name}</div>`).join('')
        : `<div class="track-item" style="color:var(--muted)">Sin canciones listadas</div>`;

      return `
        <div class="card">
          <div class="card-img-container">
            <img src="${item.cover || 'https://via.placeholder.com/300'}" alt="${item.name}">
            <div class="badges-overlay">
              <span class="badge">${item.type}</span>
              <span class="badge" style="background:var(--accent); color:#101114;">${(item.language || 'es').toUpperCase()}</span>
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-title">${item.name}</h3>
            <div class="card-author">${item.author || 'IKA Studios'} (${item.tracks ? item.tracks.length : 0} temas)</div>
            <div class="tracks-list">
              ${tracksHtml}
            </div>
          </div>
        </div>
      `;
    }).join('');

  } catch (err) {
    grid.innerHTML = `<div class="no-results" style="color:var(--error);">Error al cargar los datos: ${err.message}</div>`;
    console.error(err);
  }
}
</script>

</body>
</html>
